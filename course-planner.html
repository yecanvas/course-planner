        break;
      case 'export-csv':
        if (!state.courses.length) { toast('还没有课程可以导出'); break; }
        downloadText('我的课表-' + toYMD(new Date()) + '.csv', coursesToCSV(state.courses), 'text/csv;charset=utf-8', true);
        toast('已导出 CSV，可用 Excel/WPS 打开编辑');
        break;
      case 'imp-parse': {
        var ta2 = qs('#impText');
        var txt = ta2 ? ta2.value : '';
        if (!txt.trim()) { toast('请先粘贴课表内容，或点「选择文件」'); break; }
        var res = parseScheduleText(txt, state.settings);
        if (!res.courses.length) {
          toast('没能识别出课程，请核对内容，或改用 CSV 模板');
          break;
        }
        buildPending(res.courses, res.warnings, res.format);
        break;
      }
      case 'imp-toggle': {
        if (!pendingImport) { break; }
        var ti2 = parseInt(el.getAttribute('data-i'), 10);
        if (pendingImport.courses[ti2]) { pendingImport.courses[ti2]._ok = !pendingImport.courses[ti2]._ok; }
        renderImportPreview();
        break;
      }
      case 'imp-confirm': {
        if (!pendingImport) { break; }
        var use = pendingImport.courses.filter(function (c) { return c._ok; });
        if (!use.length) { toast('没有勾选任何课程'); break; }
        var doClear = !!pendingImport.clear;
        if (doClear && !confirm('将先清空现有 ' + state.courses.length + ' 门课程，再导入这 ' + use.length + ' 门。确定吗？')) { break; }
        if (doClear) { state.courses = []; }
        for (var qi = 0; qi < use.length; qi++) {
          var src = use[qi];
          state.courses.push({
            id: uid('c_'), name: src.name, teacher: src.teacher, location: src.location, note: src.note,
            color: src.color || COLORS[state.courses.length % COLORS.length],
            day: src.day, startPeriod: src.startPeriod, endPeriod: src.endPeriod,
            weekStart: src.weekStart, weekEnd: src.weekEnd, parity: src.parity

        pendingImport = null;
        save();
        closeModal();
        render();
        toast('已导入 ' + use.length + ' 门课程');
        break;
      }
      case 'print':
        window.print();
        break;
      case 'timer-toggle':
        if (timer.running) { timerPause(); } else { timerStart(); }
        break;
      case 'timer-reset':
        timerReset();
        break;
      case 'timer-switch':
        timerSwitch();
        break;
      default:

  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (!form || !form.getAttribute) { return; }
    var kind = form.getAttribute('data-form');
    if (!kind) { return; }
    e.preventDefault();
    if (kind === 'course') { submitCourse(form); }
    else if (kind === 'task') { submitTask(form); }
    else if (kind === 'settings') { submitSettings(form); }
    else if (kind === 'quick-task') {
      var fd = new FormData(form);
      var title = String(fd.get('title') || '').trim();
      if (!title) { toast('请输入任务内容'); return; }
      state.tasks.push({
        id: uid('t_'),
        title: title,
        due: String(fd.get('due') || ''),
        priority: String(fd.get('priority') || 'normal'),
        courseId: String(fd.get('courseId') || ''),
        note: '', done: false, createdAt: Date.now()
      });
      save(); render();
      toast('任务已添加');
      var inp = qs('form[data-form=quick-task] input[name=title]');

  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) { return; }
    var field = el.getAttribute('data-field');
    if (field === 'taskSort') {
      state.ui.taskSort = el.value; save(); render(); return;
    }
    /* 字号改成即时生效，方便边看边调 */
    if (field === 'fontScale') {
      var fv = String(el.value || 'm');
      state.settings.fontScale = ['s', 'm', 'l', 'xl'].indexOf(fv) >= 0 ? fv : 'm';
      applyFontScale(); save();
      return;
    }
    if (field === 'periodsPerDay') {
      var form = el.closest('form');
      var n = clampInt(el.value, 4, 16, state.settings.periodsPerDay);
      var rows = 0;
      if (form) { while (form.querySelector('input[name="p' + rows + 's"]')) { rows++; } }
      var read = form ? collectTimes(form, rows) : [];
      var prev = state.settings.periods;
      var times = [];
      for (var i = 0; i < n; i++) {
        var a = (read[i] && read[i][0]) || (prev[i] && prev[i][0]) || DEFAULT_TIMES[i % DEFAULT_TIMES.length][0];
        var b = (read[i] && read[i][1]) || (prev[i] && prev[i][1]) || DEFAULT_TIMES[i % DEFAULT_TIMES.length][1];
        times.push([a, b]);
      }
      state.settings.periodsPerDay = n;
      state.settings.periods = times;
      // 只就地重建时间表，避免整页重渲染打断用户后续操作
      var tb = form ? form.querySelector('table.times tbody') : null;
      if (tb) { tb.innerHTML = timeRowsHtml(times); }
      save();
      return;
    }
    if (el.id === 'importFile') {
      var f = el.files && el.files[0];
      if (f) { importData(f); }
      el.value = '';
    }
    if (el.id === 'impClear' && pendingImport) {
      pendingImport.clear = !!el.checked;
      return;
    }
    if (el.id === 'impFileInput') {
      var f2 = el.files && el.files[0];
      if (f2) { importFileToPreview(f2); }
      el.value = '';
    }

  /* =======================================================
     点按动态效果：涟漪 + 震动
     ======================================================= */
  var RIPPLE_SEL = '.btn,.icon-btn,.chip,.tab,.daychip,.check,.wc,.sw,.g-slot,.course,.dcard,[data-act]';

  function reducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { return false; }
  }
  function haptic() {
    if (!state || !state.settings.haptics) { return; }
    try { if (navigator.vibrate) { navigator.vibrate(8); } } catch (e) { /* 忽略 */ }
  }
  /* 涟漪画在固定层里：按钮点完往往马上被重新渲染掉，
     如果直接塞进按钮内部，动画会跟着一起消失 */
  function spawnRipple(el, x, y) {
    var layer = qs('#rippleLayer');
    if (!layer) { return; }
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) { return; }
    var col = '#000000', radius = '10px';
    try {
      var cs = window.getComputedStyle(el);
      if (cs) {
        col = cs.color || col;
        radius = cs.borderRadius || radius;
      }
    } catch (e) { /* 忽略 */ }
    var size = Math.max(r.width, r.height) * 2;
    var box = document.createElement('div');
    box.className = 'rp';
    box.style.left = r.left + 'px';
    box.style.top = r.top + 'px';
    box.style.width = r.width + 'px';
    box.style.height = r.height + 'px';
    box.style.borderRadius = radius;
    var dot = document.createElement('i');
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.style.left = (x - r.left - size / 2) + 'px';
    dot.style.top = (y - r.top - size / 2) + 'px';
    dot.style.background = col;
    box.appendChild(dot);
    layer.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) { box.parentNode.removeChild(box); }
    }, 560);
  }

  document.addEventListener('pointerdown', function (e) {
    if (typeof e.button === 'number' && e.button !== 0) { return; }
    var t = e.target;
    if (!t || !t.closest) { return; }
    var el = t.closest(RIPPLE_SEL);
    if (!el || el.disabled) { return; }
    haptic();
    if (reducedMotion()) { return; }
    spawnRipple(el, e.clientX, e.clientY);
  }, { passive: true });

  /* 让工具在用户自己的手机上跑一遍检查，直接告诉他卡在哪 */
  function runInstallDiagnosis() {
    var u = uaInfo();
    var rows = [];
    function add(ord, s, t, a) { rows.push({ ord: ord, s: s, t: t, a: a || '' }); }
    var isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

    add(1, 'info', '系统 / 浏览器：' + (u.ios ? 'iPhone / iPad' : (u.android ? '安卓' : '电脑')) + ' · ' + browserName(u), '');

    if (isStandaloneApp()) {
      add(2, 'ok', '已经是以 App 模式在运行了', '不用再装。如果桌面没图标，去手机的「应用列表 / 资源库」翻翻。');
    } else {
      add(2, 'warn', '不是 App 模式（还在浏览器里）', '说明还没装成功，或者打开的方式不对。');
    }

    if (location.protocol === 'https:' || isLocalhost) {
      add(3, 'ok', '网址是安全上下文（安装的必要条件）', '');
    } else {
      add(3, 'bad', '网址不是 https，而是 ' + location.protocol, '必须从 https 网址打开才能装成 App。');
    }

    if (u.wechat) {
      add(4, 'bad', '你现在是在微信里打开的', '微信没有安装功能，装不了。点右上角「…」→「用浏览器打开」，再按下面的办法做。');
    } else if (u.ios && !u.safari) {
      add(4, 'bad', 'iPhone 上用「' + browserName(u) + '」没有安装入口', 'iPhone 上只有 Safari 能「添加到主屏幕」。复制网址 → 打开 Safari → 重新访问。');
    } else if (u.ios && u.safari) {
      add(4, 'ok', 'iPhone + Safari，正确的组合', '用底部中间的分享按钮 → 添加到主屏幕。');
    } else if (u.android) {
      add(4, 'ok', '安卓系统', '用浏览器的 ⋮ 菜单找「安装应用」或「添加到主屏幕」。');
    } else {
      add(4, 'ok', '电脑浏览器', '点地址栏右边的安装图标，或 ⋮ 菜单里的「安装」。');
    }

    if (installPrompt) {
      add(5, 'ok', '浏览器已允许安装（捕获到安装事件）', '可以回上一页点「📲 安装到这台设备」按钮。');
    } else if (!u.ios) {
      add(5, 'warn', '还没收到浏览器的安装许可', '常见原因：页面刚改过还没重新加载。先刷新页面再试。');
    }

      openModal('<h3>安装自检</h3><p class="sub">正在检查…</p>', true);
      Promise.all(jobs).then(function () {
        rows.sort(function (a, b) { return a.ord - b.ord; });
        var h = '<h3>安装自检</h3><p class="sub">' + esc(browserName(u)) + '，本地文件方式</p>';
        h += '<div class="list">';
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          var mark = r.s === 'ok' ? '✅' : (r.s === 'warn' ? '⚠️' : (r.s === 'bad' ? '❌' : 'ℹ️'));
          h += '<div class="item"><div class="grow"><div class="t1">' + mark + ' ' + esc(r.t) + '</div>' +
               (r.a ? '<div class="t2">' + esc(r.a) + '</div>' : '') + '</div></div>';
        }
        h += '</div><div class="modal-foot"><button type="button" class="btn primary" data-act="close-modal">知道了</button></div>';
        openModal(h, true);
      });
      return;
    }
    var mlink = qs('link[rel=manifest]');
    if (!mlink) {
      add('bad', '页面里没有 manifest 链接', '这个页面可能是旧版本，请从正式网址重新打开。');
    } else {
      jobs.push(fetch(mlink.href).then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        var ct = (r.headers.get('content-type') || '');
        add(6, 'ok', 'manifest 能下载（' + (ct.split(';')[0] || '未知类型') + '）', '');
        return r.json();
      }).then(function (j) {
        add(7, 'ok', 'manifest 内容正常：' + j.name + '，显示模式 ' + j.display + '，' + (j.icons || []).length + ' 个图标', '');
        var has192 = (j.icons || []).some(function (i) { return String(i.sizes).indexOf('192') >= 0; });
        var has512 = (j.icons || []).some(function (i) { return String(i.sizes).indexOf('512') >= 0; });
        if (!has192 || !has512) { add(7, 'bad', '图标尺寸不全（需要 192 和 512）', '重新上传完整的发布包。'); }
        return Promise.all((j.icons || []).map(function (i) {
          var url = i.src;
          return fetch(url, { method: 'GET' }).then(function (r) {
            if (!r.ok) { add(8, 'bad', '图标取不到：' + url + '（HTTP ' + r.status + '）', '这个文件没传上去，重新上传发布包。'); }
            return null;
          }).catch(function () {
            add(8, 'bad', '图标取不到：' + url, '这个文件没上传成功。');
          });
        }));
      }).catch(function (e) {
        add(6, 'bad', 'manifest 打不开：' + (e && e.message ? e.message : e), '多半是文件没上传成功，或文件名对不上。');
      }));
    }

    jobs.push(fetch('sw.js', { method: 'GET' }).then(function (r) {
      if (r.ok) { add(9, 'ok', 'Service Worker 文件在（离线可用的前提）', ''); }
      else { add(9, 'bad', 'sw.js 取不到（HTTP ' + r.status + '）', '这个文件没传上去，浏览器就不会认为它是可安装的应用。'); }
    }).catch(function () { add(9, 'bad', 'sw.js 取不到', '网络问题，或文件没上传。'); }));

    if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        var active = rs.some(function (r) { return r.active; });
        if (active) { add(10, 'ok', 'Service Worker 已注册并生效', ''); }
        else { add(10, 'warn', 'Service Worker 还没生效', '刷新一次页面通常就好了。'); }
      }).catch(function () {
        add(10, 'warn', '无法查询 Service Worker 状态', '');
      }));
    } else {
      add(10, 'warn', '这个浏览器不支持 Service Worker', '');
    }

    openModal('<h3>安装自检</h3><p class="sub">正在检查…</p>', true);

    Promise.all(jobs).then(function () {
      rows.sort(function (a, b) { return a.ord - b.ord; });
      var badCount = rows.filter(function (r) { return r.s === 'bad'; }).length;
      var head;
      if (badCount) { head = '发现 ' + badCount + ' 个问题，看下面标 ❌ 的行。'; }
      else if (isStandaloneApp()) { head = '一切正常，你已经装好了。'; }
      else { head = '硬件条件都满足，按提示操作就能装上。'; }

      var h = '<h3>安装自检</h3><p class="sub">' + esc(head) + '</p>';
      h += '<div class="list">';
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var mark = r.s === 'ok' ? '✅' : (r.s === 'warn' ? '⚠️' : (r.s === 'bad' ? '❌' : 'ℹ️'));
        h += '<div class="item"><div class="grow">';
        h += '<div class="t1">' + mark + ' ' + esc(r.t) + '</div>';
        if (r.a) { h += '<div class="t2">' + esc(r.a) + '</div>'; }
        h += '</div></div>';
      }
      h += '</div>';
      h += '<div class="modal-foot">';
      if (badCount === 0 && !isStandaloneApp()) {
        h += '<button type="button" class="btn" data-act="install-help">看安装步骤</button>';
      }
      h += '<button type="button" class="btn primary" data-act="close-modal">知道了</button>';
      h += '</div>';
      openModal(h, true);
    });
  }

  /* =======================================================
     启动
     ======================================================= */
  var firstRun = load();
  applyTheme();
  timerSetMode('focus', true);
  render();
  if (firstRun) { welcome(); }

})();
</script>
</body>
</html>
