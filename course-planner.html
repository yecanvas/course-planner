<title>课表规划工具</title>
<style>
:root{
  --bg:#eef2f8; --panel:#ffffff; --panel2:#f4f7fc; --text:#16202e; --muted:#6a7a90;
  --line:#dfe6f1; --accent:#3b6df6; --accent2:#e9f0ff; --danger:#e5484d; --ok:#12a06a; --warn:#d99400;
  --radius:14px; --gutter:78px;
  /* 字号缩放：所有 font-size 都写成 calc(Npx * var(--fz))，改 --fz 就能整体放大缩小。
     时间轴宽度和课表行高也要跟着走，否则字变大了格子装不下。 */
  --fz:1;
  --taxis:calc(54px * var(--fz));
  --rowh:calc(46px * var(--fz));
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 30px rgba(16,24,40,.07);
}
html[data-fs="s"]{ --fz:.9; }
html[data-fs="l"]{ --fz:1.15; }
html[data-fs="xl"]{ --fz:1.3; }
html[data-theme="dark"]{
  --bg:#0f131a; --panel:#161c26; --panel2:#1c2431; --text:#e7edf6; --muted:#8fa0b8;
  --line:#28313f; --accent:#5b8cff; --accent2:#1e2a44; --danger:#ff6369; --ok:#31c48d; --warn:#e5b53c;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
/* 装成 App 后页面要固定住，不允许双指缩放（配合 viewport 里的 user-scalable=no）。
   pan-x pan-y 只放行滚动，同时挡掉双指缩放和双击放大。 */
html{
  touch-action:pan-x pan-y;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overscroll-behavior-y:none;
}
body{
  background:var(--bg); color:var(--text); font-size:calc(14px * var(--fz)); line-height:1.55;
  font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
a{color:var(--accent);}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:16px;
  padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:calc(15px * var(--fz)); white-space:nowrap;}
.brand .logo{font-size:calc(18px * var(--fz));}
.tabs{display:flex; gap:4px; flex:1; overflow-x:auto;}
.tab{
  border:0; background:transparent; color:var(--muted); padding:7px 14px; border-radius:9px;
  font-weight:600; white-space:nowrap; transition:.15s;
}
.tab:hover{background:var(--panel2); color:var(--text);}
.tab.active{background:var(--accent); color:#fff;}
.topbar-right{display:flex; align-items:center; gap:8px;}
.badge{
  background:var(--accent2); color:var(--accent); font-weight:700; font-size:calc(12.5px * var(--fz));
  padding:5px 11px; border-radius:999px; white-space:nowrap;
}
.icon-btn{
  border:1px solid var(--line); background:var(--panel2); border-radius:9px;
  width:34px; height:34px; display:grid; place-items:center; font-size:calc(15px * var(--fz));
}
.icon-btn:hover{border-color:var(--accent);}

/* ---------- 布局 ---------- */
main{padding:18px; max-width:1500px; margin:0 auto;}
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px;
}
.panel + .panel{margin-top:16px;}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px;}
.toolbar .spacer{flex:1;}
.section-title{font-weight:700; font-size:calc(15px * var(--fz)); margin:0 0 12px; display:flex; align-items:center; gap:8px;}
.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.muted{color:var(--muted);}
.small{font-size:calc(12.5px * var(--fz));}
.hint{font-size:calc(12.5px * var(--fz)); color:var(--muted); line-height:1.7;}

/* ---------- 控件 ---------- */
.btn{
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  padding:7px 13px; border-radius:9px; font-weight:600; font-size:calc(13px * var(--fz)); white-space:nowrap;
  transition:.15s;
}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.primary:hover{filter:brightness(1.08); color:#fff;}
.btn.danger{color:var(--danger);}
.btn.danger:hover{border-color:var(--danger); color:var(--danger); background:var(--panel2);}
.btn.tiny{padding:4px 9px; font-size:calc(12px * var(--fz)); border-radius:7px;}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=datetime-local],select,textarea{
  border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:7px 10px;
  outline:none; transition:.15s; max-width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent2);}
textarea{resize:vertical; min-height:60px;}
label.fld{display:flex; flex-direction:column; gap:5px; font-size:calc(12.5px * var(--fz)); color:var(--muted); font-weight:600;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.row > *{flex:1 1 0; min-width:120px;}
.chip-set{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1px solid var(--line); background:var(--panel); border-radius:999px;
  padding:5px 13px; font-size:calc(12.5px * var(--fz)); font-weight:600; color:var(--muted);
}
.chip:hover{border-color:var(--accent); color:var(--accent);}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ---------- 课表网格（时间轴 + 7 天，整屏铺满不横向滚动） ---------- */
.grid-wrap{padding-bottom:4px;}
.grid{
  display:grid; gap:3px; padding:0; background:transparent; border-radius:12px;
  min-height:56vh;
}
.g-corner{background:transparent;}
/* 纵向的时间轴：上面是开始时间，下面是结束时间 */
.g-time{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0; line-height:1.15; color:var(--muted); text-align:center;
}
.g-time b{font-size:calc(11.5px * var(--fz)); font-weight:600; color:var(--muted); letter-spacing:-.2px;}
.g-time span{font-size:calc(9.5px * var(--fz)); opacity:.72; letter-spacing:-.2px;}
.g-time .g-period{font-size:calc(9px * var(--fz)); opacity:.6; margin-bottom:1px;}
/* 表头：星期 + 日期，今天高亮 */
.g-day{
  background:var(--panel2); border-radius:10px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; padding:6px 2px 5px;
  line-height:1.15; border:1px solid transparent;
}
.g-day .d-name{font-size:calc(11.5px * var(--fz)); font-weight:600; color:var(--muted);}
.g-day .d-date{font-size:calc(16px * var(--fz)); font-weight:800; letter-spacing:-.5px;}
.g-day.is-today{background:var(--accent); border-color:var(--accent); color:#fff;}
.g-day.is-today .d-name{color:rgba(255,255,255,.86);}
.g-day.is-weekend .d-date{color:var(--muted);}
.g-day.is-today.is-weekend .d-date{color:#fff;}
/* 空白格子 */
.g-slot{background:var(--panel2); border-radius:9px; cursor:pointer; transition:.12s;}
.g-slot:hover{background:var(--accent2);}
.g-slot.is-todaycol{background:color-mix(in srgb, var(--accent) 9%, var(--panel2));}
.g-slot.now{border-top:2px solid var(--danger);}
.g-slot.grp-2, .g-time.grp-2{border-top:2px solid var(--line);}
.g-slot.grp-3, .g-time.grp-3{border-top:2px solid var(--line);}
/* 课程卡片：整块填色，和手机课表 App 一致 */
.course{
  border-radius:10px; padding:5px 6px; overflow:hidden; cursor:pointer;
  background:var(--c); color:#16202e; position:relative;
  transition:.12s; margin:0; display:flex; flex-direction:column; gap:1px;
}
.course:hover{filter:brightness(1.04); box-shadow:var(--shadow);}
html[data-theme="dark"] .course{
  background:color-mix(in srgb, var(--c) 34%, var(--panel));
  color:var(--text);
}
html[data-theme="dark"] .course:hover{background:color-mix(in srgb, var(--c) 42%, var(--panel));}
.course .c-name{
  font-weight:700; font-size:calc(11.5px * var(--fz)); line-height:1.25; word-break:break-all;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
.course .c-loc{
  font-size:calc(9.5px * var(--fz)); line-height:1.2; opacity:.82; word-break:break-all;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.course .c-t{font-size:calc(9.5px * var(--fz)); line-height:1.2; opacity:.72; word-break:break-all;}
.course .c-tip{font-size:calc(9px * var(--fz)); opacity:.7;}

/* ---------- 列表 ---------- */
.list{display:flex; flex-direction:column; gap:8px;}
.item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line);
  border-radius:11px; background:var(--panel2); transition:.15s;
}
.item:hover{border-color:var(--accent);}
.item .grow{flex:1; min-width:0;}
.item .t1{font-weight:700; font-size:calc(13.5px * var(--fz)); word-break:break-all;}
.item .t2{font-size:calc(12px * var(--fz)); color:var(--muted); margin-top:2px; word-break:break-all;}
.swatch{width:12px; height:12px; border-radius:4px; flex:0 0 auto;}
.check{
  width:21px; height:21px; flex:0 0 auto; border-radius:7px; border:1.5px solid var(--line);
  background:var(--panel); display:grid; place-items:center; font-size:calc(12px * var(--fz)); color:transparent;
  padding:0;
}
.check:hover{border-color:var(--accent);}
.check.on{background:var(--ok); border-color:var(--ok); color:#fff;}
.item.done .t1{text-decoration:line-through; color:var(--muted);}
.item.overdue .t2{color:var(--danger); font-weight:600;}
.tag{font-size:calc(11px * var(--fz)); padding:2px 8px; border-radius:999px; font-weight:700; white-space:nowrap;}
.p-high{background:rgba(229,72,77,.15); color:var(--danger);}
.p-normal{background:rgba(59,109,246,.15); color:var(--accent);}
.p-low{background:rgba(106,122,144,.15); color:var(--muted);}
.tag-warn{background:rgba(217,148,0,.16); color:var(--warn);}
.tag-ok{background:rgba(18,160,106,.15); color:var(--ok);}

/* ---------- 规划页 ---------- */
.plan-layout{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr); gap:16px; align-items:start;}
@media (max-width:960px){ .plan-layout{grid-template-columns:1fr;} }
.quick-form{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.quick-form input[type=text]{flex:2 1 200px;}
.quick-form input[type=datetime-local]{flex:1 1 190px;}
.quick-form select{flex:0 1 92px;}

.timer{text-align:center; padding:6px 0 2px;}
.timer .t-time{font-size:calc(44px * var(--fz)); font-weight:800; letter-spacing:2px; font-variant-numeric:tabular-nums; line-height:1.1;}
.timer .t-label{font-size:calc(12.5px * var(--fz)); color:var(--muted); margin-top:2px;}
.timer .t-btns{display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap;}
.timer.focus .t-time{color:var(--accent);}
.timer.brk .t-time{color:var(--ok);}

/* ---------- 统计 ---------- */
.stat-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
.stat{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:13px 15px;}
.stat .v{font-size:calc(25px * var(--fz)); font-weight:800; line-height:1.2;}
.stat .k{font-size:calc(12.5px * var(--fz)); color:var(--muted); margin-top:2px;}
.bars{display:flex; align-items:flex-end; gap:10px; height:150px; padding:8px 4px 0;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;}
.bar{width:100%; max-width:52px; background:var(--accent); border-radius:7px 7px 3px 3px; min-height:3px; transition:.3s;}
.bar.today{background:var(--ok);}
.bar-lb{font-size:calc(11.5px * var(--fz)); color:var(--muted);}
.bar-v{font-size:calc(11.5px * var(--fz)); font-weight:700;}
.hbar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.hbar-row .nm{width:150px; font-size:calc(12.5px * var(--fz)); font-weight:600; flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hbar-track{flex:1; height:16px; background:var(--panel2); border-radius:8px; overflow:hidden; border:1px solid var(--line);}
.hbar{height:100%; border-radius:8px; transition:.3s;}
.hbar-row .vv{font-size:calc(12px * var(--fz)); color:var(--muted); width:66px; text-align:right; flex:0 0 auto;}

/* ---------- 设置 ---------- */
.set-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;}
table.times{width:100%; border-collapse:collapse; font-size:calc(13px * var(--fz));}
table.times th,table.times td{padding:5px 6px; border-bottom:1px solid var(--line); text-align:left;}
table.times th{font-size:calc(12px * var(--fz)); color:var(--muted); font-weight:600;}
table.times input[type=time]{padding:4px 8px; width:120px;}

/* ---------- 点按动态效果 ---------- */
/* 涟漪画在独立的固定层里，这样即使按钮点完就被重新渲染掉，动画也不会中断 */
#rippleLayer{position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden;}
#rippleLayer .rp{position:fixed; overflow:hidden; pointer-events:none; will-change:opacity;}
#rippleLayer .rp i{
  position:absolute; border-radius:50%; display:block;
  animation:rpGo .5s cubic-bezier(.2,.7,.4,1) forwards;
}
@keyframes rpGo{
  from{transform:scale(.1); opacity:.22;}
  to{transform:scale(1); opacity:0;}
}
/* 按下去时轻微缩小，给手指一个“按到了”的反馈。
   只给不包含其它按钮的元素加，避免内外两层同时缩小。 */
.btn,.icon-btn,.chip,.tab,.daychip,.check,.wc,.sw,.course,.dcard,.g-slot,.item,.dayrow{
  -webkit-tap-highlight-color:transparent;
  transition:transform .11s cubic-bezier(.2,.8,.3,1), background-color .16s ease,
             border-color .16s ease, color .16s ease, box-shadow .16s ease, filter .16s ease;
}
.btn:active,.icon-btn:active,.chip:active,.tab:active,.daychip:active,
.check:active,.wc:active,.sw:active{transform:scale(.95);}
.course:active,.dcard:active,.g-slot:active{transform:scale(.985);}
/* 切换页面时内容淡入上浮 */
#main.view-in{animation:viewIn .26s cubic-bezier(.2,.8,.3,1) both;}
@keyframes viewIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:none;}
}
/* 系统开了“减弱动态效果”就全部关掉 */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}

/* ---------- 弹窗 / toast ---------- */
.modal-mask{
  position:fixed; inset:0; background:rgba(12,18,28,.5); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; padding:18px; z-index:80;
}
.modal{
  background:var(--panel); border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.32);
  width:100%; max-width:560px; max-height:90vh; overflow:auto; padding:20px;
  animation:pop .16s ease-out;
}
@keyframes pop{from{transform:scale(.97); opacity:.4} to{transform:scale(1); opacity:1}}
.modal h3{margin:0 0 4px; font-size:calc(16px * var(--fz));}
.modal .sub{margin:0 0 16px; font-size:calc(12.5px * var(--fz)); color:var(--muted);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid .full{grid-column:1 / -1;}
@media (max-width:560px){ .form-grid{grid-template-columns:1fr;} }
.modal-foot{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent; padding:0;}
.sw.active{border-color:var(--text); transform:scale(1.08);}
.welcome-choice{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){ .welcome-choice{grid-template-columns:1fr;} }
.wc{
  border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--panel2);
  text-align:left; transition:.15s;
}
.wc:hover{border-color:var(--accent); transform:translateY(-2px);}
.wc b{display:block; margin-bottom:5px;}
.wc span{font-size:calc(12.5px * var(--fz)); color:var(--muted);}
#toastRoot{position:fixed; right:18px; bottom:18px; z-index:120; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--text); color:var(--panel); padding:10px 15px; border-radius:11px; font-size:calc(13px * var(--fz));
  box-shadow:0 10px 30px rgba(0,0,0,.28); animation:pop .16s ease-out; max-width:320px;
}
.warnbar{
  background:rgba(217,148,0,.13); border:1px solid rgba(217,148,0,.4); color:var(--warn);
  padding:9px 13px; border-radius:10px; font-size:calc(12.5px * var(--fz)); margin-bottom:12px;
}
.empty{text-align:center; color:var(--muted); padding:26px 10px; font-size:calc(13px * var(--fz));}

/* ---------- 导入 ---------- */
.modal.wide{max-width:860px;}
.imp-area{
  width:100%; min-height:150px; font-family:ui-monospace,Consolas,"Courier New",monospace;
  font-size:calc(12.5px * var(--fz)); white-space:pre; overflow:auto; margin-top:6px;
}
.imp-tip{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:10px 13px; font-size:calc(12.5px * var(--fz)); color:var(--muted); line-height:1.8;
}
.imp-tip b{color:var(--text);}
.imp-steps{margin:0; padding-left:20px;}
.imp-wrap{max-height:42vh; overflow:auto; border:1px solid var(--line); border-radius:10px;}
.imp-table{width:100%; border-collapse:collapse; font-size:calc(12.5px * var(--fz));}
.imp-table th,.imp-table td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
.imp-table th{font-size:calc(11.5px * var(--fz)); color:var(--muted); font-weight:700; position:sticky; top:0; background:var(--panel); z-index:1;}
.imp-table td.nm{font-weight:700; white-space:normal; min-width:150px;}
.imp-table td.lb{color:var(--muted);}
.imp-table tr.conflict td{background:rgba(229,72,77,.10);}
.imp-table tr.off{opacity:.4;}
.imp-table tr.skip td{color:var(--muted); text-decoration:line-through;}
.imp-stat{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:12px 0 0; font-size:calc(12.5px * var(--fz));}
.imp-stat .pill{background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-weight:600;}
.imp-stat .pill.warn{color:var(--warn); border-color:rgba(217,148,0,.45);}

/* ---------- 课表页顶部信息 ---------- */
.weekhead{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:8px;}
.weekhead .wh-week{font-size:calc(21px * var(--fz)); font-weight:800; letter-spacing:-.6px; line-height:1.15;}
.weekhead .wh-day{font-size:calc(12px * var(--fz)); color:var(--muted); margin-top:2px;}
@media (max-width:760px){
  .weekhead .wh-week{font-size:calc(18px * var(--fz));}
  .weekhead .wh-day{font-size:calc(11.5px * var(--fz));}
}

/* ---------- 手机上：单日视图 ---------- */
.tab .ti{display:none; font-style:normal;}
.daybar{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch;}
.daychip{
  flex:0 0 auto; min-width:calc(54px * var(--fz)); text-align:center; padding:7px 9px; border-radius:11px;
  border:1px solid var(--line); background:var(--panel2); font-size:calc(12.5px * var(--fz)); font-weight:700;
  color:var(--muted); line-height:1.3;
}
.daychip .dc-date{display:block; font-size:calc(10.5px * var(--fz)); font-weight:600; opacity:.85;}
.daychip.today{border-color:var(--accent); color:var(--accent);}
.daychip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.dlist{display:flex; flex-direction:column; gap:9px;}
.dcard{
  display:flex; gap:11px; padding:11px 12px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel2); cursor:pointer; border-left:5px solid var(--c);
  background:color-mix(in srgb, var(--c) 12%, var(--panel));
}
html[data-theme="dark"] .dcard{background:color-mix(in srgb, var(--c) 22%, var(--panel));}
.dcard .dt{flex:0 0 64px; font-size:calc(11.5px * var(--fz)); font-weight:700; color:var(--muted); line-height:1.4;}
.dcard .dt b{display:block; color:var(--text); font-size:calc(13px * var(--fz));}
.dcard .db{flex:1; min-width:0;}
.dcard .dn{font-weight:700; font-size:calc(15px * var(--fz)); line-height:1.3; word-break:break-all;}
.dcard .dm{font-size:calc(12.5px * var(--fz)); color:var(--muted); margin-top:3px; word-break:break-all;}
.dcard .dgo{color:var(--muted); align-self:center; font-size:calc(15px * var(--fz));}
.dayrow{display:flex; align-items:flex-start; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
.dayrow:last-child{border-bottom:0;}
.dayrow .dw{flex:0 0 46px; font-weight:700; font-size:calc(13px * var(--fz));}
.dayrow.is-today .dw{color:var(--accent);}

/* 触摸设备上关掉 hover 造成的“粘住”效果 */
@media (hover:none){
  .g-slot:hover{background:var(--panel);}
  .course:hover{transform:none; box-shadow:none;}
  .btn:hover{border-color:var(--line); color:var(--text);}
  .btn.primary:hover{filter:none; color:#fff;}
  .btn.danger:hover{color:var(--danger);}
  .tab:hover{background:transparent; color:var(--muted);}
  .tab.active:hover{background:var(--accent); color:#fff;}
  .item:hover{border-color:var(--line);}
  .chip:hover{border-color:var(--line); color:var(--muted);}
  .chip.active:hover{background:var(--accent); border-color:var(--accent); color:#fff;}
  .wc:hover{border-color:var(--line); transform:none;}
  .icon-btn:hover{border-color:var(--line);}
}

/* ---------- 手机上：整体布局 ---------- */
@media (max-width:760px){
  :root{ --gutter:54px; --radius:12px; }
  main{padding:10px 10px calc(74px + env(safe-area-inset-bottom));}
  .panel{padding:13px;}
  .panel + .panel{margin-top:10px;}
  .topbar{padding:8px 12px; gap:10px;}
  .brand{font-size:calc(14.5px * var(--fz));}
  .badge{font-size:calc(12px * var(--fz)); padding:4px 10px;}
  .icon-btn{width:36px; height:36px;}

  /* 四个 Tab 挪到底部，方便单手点 */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:60; gap:2px;
    background:var(--panel); border-top:1px solid var(--line);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(16,24,40,.07); overflow:visible;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:5px 2px; border-radius:10px; font-size:calc(11px * var(--fz)); font-weight:600;
  }
  .tab .ti{display:block; font-size:calc(18px * var(--fz)); line-height:1.1;}
  .tab.active{background:transparent; color:var(--accent);}

  /* 控件放大到能点得准；输入框 16px 可避免 iOS 聚焦时自动放大页面 */
  .btn{padding:9px 14px; font-size:calc(14px * var(--fz));}
  .btn.tiny{padding:6px 11px; font-size:calc(12.5px * var(--fz));}
  input[type=text],input[type=date],input[type=time],input[type=number],
  input[type=datetime-local],select,textarea{font-size:calc(16px * var(--fz)); padding:8px 10px;}
  .toolbar{gap:8px;}

  /* 弹窗改成底部抽屉，按钮拉通排 */
  .modal-mask{align-items:flex-end; padding:0;}
  .modal{
    max-width:100%; max-height:93vh; border-radius:18px 18px 0 0;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  }
  .modal-foot{position:sticky; bottom:0; background:var(--panel); padding-top:10px;}
  .modal-foot .btn{flex:1; text-align:center;}
  .modal-foot .btn.danger{flex:0 0 auto;}

  /* 手机上整周表格铺满一屏：时间轴收窄，字号调小 */
  :root{ --taxis:calc(38px * var(--fz)); --rowh:calc(42px * var(--fz)); }
  .grid{gap:2px; min-height:52vh;}
  .g-time b{font-size:calc(9.5px * var(--fz));}
  .g-time span{font-size:calc(8px * var(--fz));}
  .g-time .g-period{display:none;}
  .g-day{padding:4px 1px; border-radius:8px;}
  .g-day .d-name{font-size:calc(10px * var(--fz));}
  .g-day .d-date{font-size:calc(14px * var(--fz));}
  .course{padding:4px 5px; border-radius:8px;}
  .course .c-name{font-size:calc(10.5px * var(--fz)); -webkit-line-clamp:5;}
  .course .c-loc{font-size:calc(8.5px * var(--fz)); -webkit-line-clamp:3;}
  .course .c-t{font-size:calc(8.5px * var(--fz));}
  .course .c-tip{display:none;}

  /* 统计 / 规划页的细节 */
  .hbar-row{flex-wrap:wrap;}
  .hbar-row .nm{width:100%;}
  .hbar-row .vv{width:auto; margin-left:auto;}
  .stat .v{font-size:calc(21px * var(--fz));}
  .timer .t-time{font-size:calc(38px * var(--fz));}
  .quick-form > *{flex:1 1 100%;}
  .imp-table th,.imp-table td{padding:5px 6px; font-size:calc(12px * var(--fz));}
  .welcome-choice{gap:10px;}
}

@media print{
  .topbar,.toolbar,.plan-layout .side,.no-print{display:none !important;}
  body{background:#fff;}
  .panel{box-shadow:none; border:0;}
  main{padding:0;}
}
</style>

<body>

<header class="topbar">
  <div class="brand"><span class="logo">📘</span><span>课表规划工具</span></div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-act="tab" data-v="schedule"><i class="ti">📘</i><span>课表</span></button>
    <button class="tab" data-act="tab" data-v="tasks"><i class="ti">⏱</i><span>规划</span></button>
    <button class="tab" data-act="tab" data-v="stats"><i class="ti">📊</i><span>统计</span></button>
    <button class="tab" data-act="tab" data-v="settings"><i class="ti">⚙️</i><span>设置</span></button>
  </nav>
  <div class="topbar-right">
    <span class="badge" id="weekBadge">—</span>
    <button class="icon-btn" data-act="theme" title="切换深浅色">🌓</button>
  </div>
</header>

<main id="main"></main>
<div id="modalRoot"></div>
<div id="rippleLayer"></div>
<div id="toastRoot"></div>

<script>
(function () {
  'use strict';

  /* =======================================================
     常量
     ======================================================= */
  var STORE_KEY = 'coursePlanner.v1';
  var DAY_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  /* 柔和的马卡龙色，和常见的手机课表 App 接近：深色文字压在上面也看得清 */
  var COLORS = ['#8fc0ea', '#f0a98f', '#f2a8be', '#abb9f0', '#8ed2ce',
                '#f0ce96', '#bca9ea', '#a2d5ac', '#eda6d6', '#b9c6d6'];
  var DEFAULT_TIMES = [
    ['08:00', '08:45'], ['08:55', '09:40'], ['10:00', '10:45'], ['10:55', '11:40'],
    ['14:00', '14:45'], ['14:55', '15:40'], ['16:00', '16:45'], ['16:55', '17:40'],
    ['19:00', '19:45'], ['19:55', '20:40'], ['20:50', '21:35'], ['21:45', '22:30']
  ];
  var PRIORITY = {
    high: { label: '高', cls: 'p-high' },
    normal: { label: '中', cls: 'p-normal' },
    low: { label: '低', cls: 'p-low' }
  };

  /* =======================================================
     工具函数
     ======================================================= */
  var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (m) { return ESC_MAP[m]; });
  }
  function qs(sel) { return document.querySelector(sel); }
  function uid(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function clampInt(v, min, max, dflt) {
    var n = parseInt(v, 10);
    if (isNaN(n)) { return dflt; }
    return Math.min(max, Math.max(min, n));
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* ---- 日期 ---- */
  function parseYMD(s) {
    var p = String(s || '').split('-');
    var y = parseInt(p[0], 10), m = parseInt(p[1], 10), d = parseInt(p[2], 10);
    if (isNaN(y) || isNaN(m) || isNaN(d)) { return new Date(); }
    return new Date(y, m - 1, d);
  }
  function toYMD(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function mondayOf(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var wd = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - wd);
    return x;
  }
  function dayDiff(a, b) {
    var A = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    var B = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((B - A) / 86400000);
  }
  function addDays(d, n) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }
  function todayDow() { return ((new Date().getDay() + 6) % 7) + 1; }

  /* ---- 学期周次 ---- */
  function semesterMonday() { return mondayOf(parseYMD(state.settings.semesterStart)); }
  function realWeek() {
    var w = Math.floor(dayDiff(semesterMonday(), mondayOf(new Date())) / 7) + 1;
    return w;
  }
  function dateOf(week, day) { return addDays(semesterMonday(), (week - 1) * 7 + (day - 1)); }
  function fmtMD(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }

  /* ---- 课程属性 ---- */
  function weekLabelOf(c) {
    var s = (c.weekStart === c.weekEnd) ? ('第' + c.weekStart + '周') : ('第' + c.weekStart + '-' + c.weekEnd + '周');
    if (c.parity === 'odd') { s += '（单周）'; }
    else if (c.parity === 'even') { s += '（双周）'; }
    return s;
  }
  function parityOK(parity, week) {
    if (parity === 'odd') { return week % 2 === 1; }
    if (parity === 'even') { return week % 2 === 0; }
    return true;
  }
  function inWeek(c, week) {
    if (week < c.weekStart || week > c.weekEnd) { return false; }
    return parityOK(c.parity, week);
  }
  function weekCountOf(c) {
    var n = 0;
    for (var w = c.weekStart; w <= c.weekEnd; w++) { if (parityOK(c.parity, w)) { n++; } }
    return n;
  }
  function periodLabelOf(c) {
    return DAY_NAMES[c.day - 1] + ' 第' + c.startPeriod + '-' + c.endPeriod + '节';
  }
  function timeRangeOf(c) {
    var p = state.settings.periods;
    var a = p[c.startPeriod - 1], b = p[c.endPeriod - 1];
    if (!a || !b) { return ''; }
    return a[0] + '-' + b[1];
  }
  function periodsOf(c) { return c.endPeriod - c.startPeriod + 1; }

  /* =======================================================
     状态
     ======================================================= */
  var state = null;
  var storageOK = true;
  var timer = { mode: 'focus', total: 1500, left: 1500, running: false, handle: null };

  /* 有些浏览器在 file:// 下会禁用 localStorage，这里先探测一次 */
  function probeStorage() {
    try {
      var k = '__cp_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  function defaultTimes(n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push(DEFAULT_TIMES[i % DEFAULT_TIMES.length].slice());
    }
    return out;
  }
  function defaultState() {
    var n = 12;
    return {
      version: 1,
      settings: {
        semesterStart: toYMD(mondayOf(new Date())),
        totalWeeks: 20,
        periodsPerDay: n,
        periods: defaultTimes(n),
        focusMin: 25,
        breakMin: 5,
        theme: 'auto',
        fontScale: 'm',
        haptics: false
      },
      courses: [],
      tasks: [],
      pomo: { date: '', count: 0 },
      ui: { tab: 'schedule', week: 1, day: 1, view: 'auto', taskFilter: 'open', taskSort: 'due', lastOpen: '' }
    };
  }

  function normalize(s) {
    var d = defaultState();
    if (!s || typeof s !== 'object') { return d; }
    var st = s.settings || {};
    d.settings.semesterStart = /^\d{4}-\d{2}-\d{2}$/.test(String(st.semesterStart)) ? st.semesterStart : d.settings.semesterStart;
    d.settings.totalWeeks = clampInt(st.totalWeeks, 1, 30, 20);
    d.settings.periodsPerDay = clampInt(st.periodsPerDay, 4, 16, 12);
    var times = Array.isArray(st.periods) ? st.periods : [];
    d.settings.periods = [];
    for (var i = 0; i < d.settings.periodsPerDay; i++) {
      var t = times[i];
      if (Array.isArray(t) && t.length === 2 && t[0] && t[1]) { d.settings.periods.push([String(t[0]), String(t[1])]); }
      else { d.settings.periods.push(DEFAULT_TIMES[i % DEFAULT_TIMES.length].slice()); }
    }
    d.settings.focusMin = clampInt(st.focusMin, 1, 180, 25);
    d.settings.breakMin = clampInt(st.breakMin, 1, 60, 5);
    d.settings.theme = (st.theme === 'light' || st.theme === 'dark') ? st.theme : 'auto';
    d.settings.fontScale = ['s', 'm', 'l', 'xl'].indexOf(st.fontScale) >= 0 ? st.fontScale : 'm';
    d.settings.haptics = !!st.haptics;

    d.courses = (Array.isArray(s.courses) ? s.courses : []).map(function (c) {
      return {
        id: String(c.id || uid('c_')),
        name: String(c.name || '未命名课程'),
        teacher: String(c.teacher || ''),
        location: String(c.location || ''),
        note: String(c.note || ''),

      var gain = ctx.createGain();

      for (var k2 = 0; k2 + 2 < nameLen; k2 += 2) { nm += String.fromCharCode(readU16(dirBytes, e + k2)); }
      entries.push({
        name: nm,
        type: dirBytes[e + 66],
        start: readU32(dirBytes, e + 116),
        size: readU32(dirBytes, e + 120)

    }
    if (!entries.length) { return null; }
    /* 小流（<4096 字节）走 miniFAT + miniStream */
    var miniFat = [];
    if (numMiniFat > 0) {
      var mfBytes = readChain(miniFatStart, numMiniFat * ss, fat);
      for (var m2 = 0; m2 + 4 <= mfBytes.length; m2 += 4) { miniFat.push(readU32(mfBytes, m2)); }
    }
    var root = entries[0];
    var miniStream = miniFat.length ? readChain(root.start, root.size, fat) : new Uint8Array(0);
    function readStream(entry) {
      if (entry.size < miniCutoff && miniFat.length) {
        var secs = chain(entry.start, miniFat);
        var buf = new Uint8Array(secs.length * miniSize);
        for (var i3 = 0; i3 < secs.length; i3++) {
          var o3 = secs[i3] * miniSize;
          if (o3 + miniSize > miniStream.length) { break; }
          buf.set(miniStream.subarray(o3, o3 + miniSize), i3 * miniSize);
        }
        return entry.size < buf.length ? buf.subarray(0, entry.size) : buf;
      }
      return readChain(entry.start, entry.size, fat);
    }
    var out = {};
    for (var en = 0; en < entries.length; en++) {
      if (entries[en].type === 2) { out[entries[en].name.toUpperCase()] = readStream(entries[en]); }
    }
    return out;
  }

  /* ---------- BIFF8 记录 ---------- */
  function biffRecords(buf) {
    var recs = [], p = 0;
    while (p + 4 <= buf.length) {
      var type = readU16(buf, p);
      var len = readU16(buf, p + 2);
      if (p + 4 + len > buf.length) { break; }
      recs.push({ type: type, data: buf.subarray(p + 4, p + 4 + len) });
      p += 4 + len;
    }
    return recs;
  }
  /* 共享字符串表，要正确处理跨 CONTINUE 记录的长字符串 */
  function biffReadSst(recs, startIdx) {
    var segs = [recs[startIdx].data];
    var j = startIdx + 1;
    while (j < recs.length && recs[j].type === 0x003C) { segs.push(recs[j].data); j++; }
    var total = 0;
    for (var i = 0; i < segs.length; i++) { total += segs[i].length; }
    var b = new Uint8Array(total);
    var bounds = [], off = 0;
    for (var i2 = 0; i2 < segs.length; i2++) { b.set(segs[i2], off); off += segs[i2].length; bounds.push(off); }
    function nextBound(p) {
      for (var q = 0; q < bounds.length; q++) { if (bounds[q] > p) { return bounds[q]; } }
      return total;
    }
    function atBound(p) {
      for (var q = 0; q < bounds.length; q++) { if (bounds[q] === p) { return true; } }
      return false;
    }
    var strings = [];
    var p = 8;   /* 跳过总数(4) + 唯一数(4) */
    var guard = 0;
    while (p + 3 <= total && strings.length < 20000 && guard++ < 100000) {
      var cch = readU16(b, p); p += 2;
      var grbit = b[p] || 0; p += 1;
      var high = grbit & 0x01;
      var nRuns = 0, cbExt = 0;
      if (grbit & 0x08) { nRuns = readU16(b, p); p += 2; }
      if (grbit & 0x04) { cbExt = readU32(b, p); p += 4; }
      var s = '';
      var left = cch;
      while (left > 0) {
        if (atBound(p)) { high = b[p] & 0x01; p += 1; }
        var room = nextBound(p) - p;
        if (room <= 0) { break; }
        if (high) {
          var n2 = Math.min(left, Math.floor(room / 2));
          for (var k2 = 0; k2 < n2; k2++) { s += String.fromCharCode(readU16(b, p + k2 * 2)); }
          p += n2 * 2;
          left -= n2;
        } else {
          var n1 = Math.min(left, room);
          for (var k1 = 0; k1 < n1; k1++) { s += String.fromCharCode(b[p + k1]); }
          p += n1;
          left -= n1;
        }
      }
      if (nRuns) { p += nRuns * 4; }
      if (cbExt) { p += cbExt; }
      strings.push(s);
    }
    return strings;
  }
  function biffStringAt(d, off) {
    var cch = readU16(d, off);
    var grbit = d[off + 2] || 0;
    var p = off + 3;
    var s = '';
    if (grbit & 0x01) {
      for (var i = 0; i < cch; i++) { s += String.fromCharCode(readU16(d, p + i * 2)); }
    } else {
      for (var j = 0; j < cch; j++) { s += String.fromCharCode(d[p + j] || 0); }
    }
    return s;
  }
  function rkValue(rk) {
    var v;
    if (rk & 0x02) { v = (rk | 0) >> 2; }
    else {
      var tmp = new Uint8Array(8);
      tmp[4] = (rk >>> 24) & 0xFF; tmp[5] = (rk >>> 16) & 0xFF;
      tmp[6] = (rk >>> 8) & 0xFF; tmp[7] = rk & 0xFF;
      v = new DataView(tmp.buffer).getFloat64(0, true);
    }
    return (rk & 0x01) ? v / 100 : v;
  }
  function biffGrid(stream, warnings) {
    var recs = biffRecords(stream);
    var sst = [];
    for (var i = 0; i < recs.length; i++) {
      if (recs[i].type === 0x00FC) {
        try { sst = biffReadSst(recs, i); } catch (e) { sst = []; }
        break;
      }
    }
    var cells = {}, maxR = 0, maxC = 0, mergedCells = 0;
    function put(r, c, v) {
      if (v === '' || v === null || v === undefined) { return; }
      cells[r + ',' + c] = String(v);
      if (r > maxR) { maxR = r; }
      if (c > maxC) { maxC = c; }
    }
    var pendingStr = null;
    for (var j = 0; j < recs.length; j++) {
      var t = recs[j].type, d = recs[j].data;
      /* BIFF 里的行号列号本来就是 0 基 */
      if (t === 0x00FD && d.length >= 10) {          /* LABELSST */
        put(readU16(d, 0), readU16(d, 2), sst[readU32(d, 6)] || '');
      } else if (t === 0x0204 && d.length >= 8) {    /* LABEL */
        put(readU16(d, 0), readU16(d, 2), biffStringAt(d, 6));
      } else if (t === 0x0203 && d.length >= 14) {   /* NUMBER */
        put(readU16(d, 0), readU16(d, 2), readDouble(d, 6));
      } else if (t === 0x027E && d.length >= 10) {   /* RK */
        put(readU16(d, 0), readU16(d, 2), rkValue(readU32(d, 6)));
      } else if (t === 0x00BD && d.length >= 12) {   /* MULRK */
        var mr = readU16(d, 0), mc = readU16(d, 2);
        var n = Math.floor((d.length - 6) / 6);
        for (var k = 0; k < n; k++) { put(mr, mc + k, rkValue(readU32(d, 4 + k * 6 + 2))); }
      } else if (t === 0x0006 && d.length >= 14) {   /* FORMULA */
        var fr = readU16(d, 0), fc = readU16(d, 2);
        if (d[6] === 0xFF && d[7] === 0xFF) { pendingStr = [fr, fc]; }
        else if (d[6] === 0x00 && d[7] === 0x00) { put(fr, fc, readDouble(d, 6)); }
      } else if (t === 0x0207 && pendingStr) {       /* STRING：上一个公式的文本结果 */
        put(pendingStr[0], pendingStr[1], biffStringAt(d, 0));
        pendingStr = null;
      } else if (t === 0x00E5 && d.length >= 2) {    /* MERGEDCELLS */
        var mc = readU16(d, 0);
        for (var mi = 0; mi < mc && 2 + mi * 8 + 8 <= d.length; mi++) {
          var mo = 2 + mi * 8;
          var mR1 = readU16(d, mo), mR2 = readU16(d, mo + 2);
          var mC1 = readU16(d, mo + 4);
          if (mR2 > mR1 && cells[mR1 + ',' + mC1] !== undefined) { mergedCells++; }
        }
      }
    }
    if (warnings && mergedCells) {
      warnings.push('课表里有 ' + mergedCells + ' 个纵向合并的单元格，跨越多节的大课可能只识别到第一段节次，请核对这几门课的起止节次');
    }
    var grid = [];
    for (var r2 = 0; r2 <= maxR; r2++) {
      var line = [];
      for (var c2 = 0; c2 <= maxC; c2++) {
        var v = cells[r2 + ',' + c2];
        line.push(v === undefined ? '' : v);
      }
      grid.push(line);
    }
    return grid;
  }
  function readXlsGrid(bytes, warnings) {
    var streams = oleStreams(bytes);
    if (!streams) { throw new Error('不是有效的 .xls 文件'); }
    var key = null;
    var names = Object.keys(streams);
    for (var i = 0; i < names.length; i++) {
      if (names[i] === 'WORKBOOK' || names[i] === 'BOOK') { key = names[i]; break; }
    }
    if (!key) { throw new Error('这个 .xls 里没有工作表（可能是 WPS 的 .et 格式，请另存为 .xlsx 或 CSV）'); }
    return biffGrid(streams[key], warnings);
  }

  /* ---------- 伪 .xls ①：HTML 表格 ---------- */
  function htmlCellText(cellHtml) {
    var s = String(cellHtml);
    s = s.replace(/<br\b[^>]*>/gi, '\n');
    s = s.replace(/<\/(p|div|li|h[1-6]|tr)\s*>/gi, '\n');
    s = s.replace(/<[^>]*>/g, '');
    s = xmlUnescape(s);
    s = s.replace(/\u00a0/g, ' ');
    s = s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
    return s.replace(/^\s+|\s+$/g, '');
  }
  function htmlTableToGrid(tbl) {
    var rows = String(tbl).match(/<tr\b[\s\S]*?<\/tr>/gi) || [];
    var grid = [];
    for (var i = 0; i < rows.length; i++) {
      var cells = rows[i].match(/<t[dh]\b[\s\S]*?<\/t[dh]>/gi) || [];
      if (!grid[i]) { grid[i] = []; }
      var col = 0;
      for (var c = 0; c < cells.length; c++) {
        var attrs = (cells[c].match(/^<t[dh]\b([^>]*)>/i) || [])[1] || '';
        var cs = parseInt((attrs.match(/colspan\s*=\s*"?(\d+)/i) || [])[1], 10) || 1;
        var rs = parseInt((attrs.match(/rowspan\s*=\s*"?(\d+)/i) || [])[1], 10) || 1;
        while (grid[i][col] !== undefined) { col++; }
        var txt = htmlCellText(cells[c]);
        for (var r2 = 0; r2 < rs; r2++) {
          for (var c2 = 0; c2 < cs; c2++) {
            var rr = i + r2, cc = col + c2;
            if (!grid[rr]) { grid[rr] = []; }
            grid[rr][cc] = (r2 === 0 && c2 === 0) ? txt : '';
          }
        }
        col += cs;
      }
    }
    var out = [];
    for (var r3 = 0; r3 < grid.length; r3++) {
      var line = grid[r3] || [];
      var arr = [];
      for (var k = 0; k < line.length; k++) { arr.push(line[k] === undefined ? '' : line[k]); }
      out.push(arr);
    }
    return out;
  }
  function readHtmlGrid(text) {
    var h = String(text).replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '')
      .replace(/<!--[\s\S]*?-->/g, '');
    var tables = h.match(/<table\b[\s\S]*?<\/table>/gi) || [];
    if (!tables.length) { return null; }
    var best = null;
    for (var i = 0; i < tables.length; i++) {
      var g = htmlTableToGrid(tables[i]);
      if (!best || g.length > best.length) { best = g; }
    }
    return best;
  }

  /* ---------- 伪 .xls ②：Excel 2003 XML（SpreadsheetML） ---------- */
  function readSmlGrid(text) {
    /* 注意：不能写成 <Row ... (/>|</Row>)> 的非贪婪匹配，
       因为空单元格 <Cell/> 里也含 "/>"，会把整行提前截断 */
    var rows = String(text).match(/<Row\b[^>]*>[\s\S]*?<\/Row>|<Row\b[^>]*\/>/gi) || [];
    if (!rows.length) { return null; }
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var cells = rows[i].match(/<Cell\b[^>]*>[\s\S]*?<\/Cell>|<Cell\b[^>]*\/>/gi) || [];
      var line = [];
      for (var c = 0; c < cells.length; c++) {
        var idx = (cells[c].match(/ss:Index\s*=\s*"(\d+)"/i) || [])[1];
        if (idx) { while (line.length < parseInt(idx, 10) - 1) { line.push(''); } }
        var dm = cells[c].match(/<Data\b[^>]*>([\s\S]*?)<\/Data>/i);
        line.push(dm ? xmlUnescape(dm[1]) : '');
      }
      out.push(line);
    }
    return out;
  }

  function sniffFileKind(bytes) {
    if (bytes.length > 4 && bytes[0] === 0x50 && bytes[1] === 0x4b &&
        (bytes[2] === 0x03 || bytes[2] === 0x05 || bytes[2] === 0x07)) { return 'xlsx'; }
    if (bytes.length > 8 && bytes[0] === 0xD0 && bytes[1] === 0xCF &&
        bytes[2] === 0x11 && bytes[3] === 0xE0) { return 'xls'; }
    return 'text';
  }

  function parseScheduleText(text, settings) {
    var warnings = [];
    var t = String(text).replace(/\u00a0/g, ' ');
    var courses = null, format = '';
    if (/BEGIN:VCALENDAR|BEGIN:VEVENT/i.test(t)) {
      courses = parseICSFormat(t, settings, warnings);
      format = 'ics';
    }
    if (!courses && t.indexOf('\t') >= 0 && /(星期|周|礼拜)[一二三四五六日天]/.test(t)) {
      courses = parseTableFormat(t, settings, warnings);
      if (courses) { format = 'table'; }
    }
    if (!courses) {
      var c2 = parseCSVFormat(t, settings, warnings);
      if (c2) { courses = c2; format = 'csv'; }
    }
    if (!courses) {
      var c3 = parseLineFormat(t, settings, warnings);
      if (c3) { courses = c3; format = 'line'; }
    }
    if (!courses) { courses = []; }
    return { courses: decorateCourses(courses), warnings: warnings, format: format };
  }
  function decorateCourses(courses) {
    for (var i = 0; i < courses.length; i++) {
      courses[i].color = COLORS[i % COLORS.length];
      courses[i].id = uid('c_');
      courses[i]._ok = true;
      courses[i]._conflict = false;
    }
    return courses;
  }
  /* 按文件内容把 Excel / 文本读成课程列表 */
  async function readScheduleFile(fname, buffer) {
    var bytes = new Uint8Array(buffer);
    var warnings = [];
    var kind = sniffFileKind(bytes);
    var courses = null, format = '';
    if (kind === 'xlsx') {
      var g1 = await readXlsxGrid(bytes);
      courses = parseGrid(g1, state.settings, warnings);
      format = 'xlsx';
    } else if (kind === 'xls') {
      var g2 = readXlsGrid(bytes, warnings);
      courses = parseGrid(g2, state.settings, warnings);
      format = 'xls';
    }
    if (!courses) {
      /* 文本：可能是 HTML 表格、Excel 2003 XML、CSV、.ics 或粘贴格式 */
      var text = decodeTextSmart(bytes);
      var htmlG = /<table\b/i.test(text) ? readHtmlGrid(text) : null;
      if (htmlG) {
        courses = parseGrid(htmlG, state.settings, warnings);
        if (courses) { format = 'html'; }
      }
      if (!courses && /urn:schemas-microsoft-com:office:spreadsheet/i.test(text)) {
        var smlG = readSmlGrid(text);
        if (smlG) {
          courses = parseGrid(smlG, state.settings, warnings);
          if (courses) { format = 'sml'; }
        }
      }
      if (!courses) {
        var res = parseScheduleText(text, state.settings);
        if (res.courses.length) { courses = res.courses; warnings = warnings.concat(res.warnings); format = res.format; }
      }
    }
    if (!courses || !courses.length) {
      throw new Error('没能从「' + fname + '」里识别出课程。可以试着在 Excel / WPS 里「另存为 CSV」后再导入，或直接把课表复制粘贴进来。');
    }
    if (!format) { format = 'xlsx'; }
    return { courses: decorateCourses(courses), warnings: warnings, format: format };
  }
  function buildPending(courses, warnings, format) {
    for (var i = 0; i < courses.length; i++) {
      var c = courses[i];
      c._ok = true;
      c._conflict = false;
      var hits = [];
      for (var j = 0; j < state.courses.length; j++) {
        if (overlaps(c, state.courses[j])) { hits.push(state.courses[j]); }
      }
      c._conflict = hits.length > 0;
      c._conflictNames = hits.map(function (x) { return x.name; });
    }
    pendingImport = { courses: courses, warnings: warnings || [], format: format };
    renderImportPreview();
  }

  function importFileToPreview(file) {

  function renderImportPreview() {

         '<input type="checkbox" id="impClear"' + (state.courses.length ? '' : ' disabled') +

  function downloadText(filename, text, mime, bom) {
    var blob = new Blob([(bom ? '\ufeff' : '') + text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }
  function csvEscape(v) {
    var s = String(v === null || v === undefined ? '' : v);
    if (/[",\n\r]/.test(s)) { return '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }
  function coursesToCSV(list) {
    var rows = [['课程名', '教师', '地点', '星期', '起始节', '结束节', '起始周', '结束周', '单双周'].join(',')];
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var par = c.parity === 'odd' ? '单周' : (c.parity === 'even' ? '双周' : '每周');
      rows.push([
        csvEscape(c.name), csvEscape(c.teacher), csvEscape(c.location), DAY_NAMES[c.day - 1],
        c.startPeriod, c.endPeriod, c.weekStart, c.weekEnd, par
      ].join(','));
    }
    return rows.join('\r\n');
  }

  /* 课程时间是否重叠（含周次与单双周判断） */
  function overlaps(a, b) {
    if (a.day !== b.day) { return false; }
    if (a.startPeriod > b.endPeriod || a.endPeriod < b.startPeriod) { return false; }
    var ws = Math.max(a.weekStart, b.weekStart), we = Math.min(a.weekEnd, b.weekEnd);
    for (var w = ws; w <= we; w++) {
      if (parityOK(a.parity, w) && parityOK(b.parity, w)) { return true; }
    }
    return false;
  }

     渲染：顶栏
     ======================================================= */
  function paintChrome() {
    var btns = document.querySelectorAll('#tabs .tab');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-v') === state.ui.tab;
      btns[i].className = 'tab' + (on ? ' active' : '');
    }
    var rw = realWeek();
    var badge = qs('#weekBadge');
    if (rw >= 1 && rw <= state.settings.totalWeeks) { badge.textContent = '今天是第 ' + rw + ' 周'; }
    else if (rw < 1) { badge.textContent = '学期未开始'; }
    else { badge.textContent = '学期已结束'; }

     视图：课表
     ======================================================= */
  /* 手机竖屏用单日列表更顺手；也可以手动切换 */
  function isNarrow() {
    return typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 760px)').matches;
  }
  /* 整周表格会自适应铺满一屏（手机上也能放下 7 天），所以默认都用表格；
     想只看一天时再手动切到单日列表 */
  function useDayView() {
    return state.ui.view === 'day';
  }
  /* 这一周能正常摆下的课程，以及时间重叠摆不下的 */
  function placedCourses(week) {
    var occ = {}, placed = [], conflicts = [];
    var sorted = state.courses.slice().sort(function (a, b) {
      return (a.day - b.day) || (a.startPeriod - b.startPeriod) || (a.endPeriod - b.endPeriod);
    });
    for (var i = 0; i < sorted.length; i++) {
      var c = sorted[i];
      if (!inWeek(c, week)) { continue; }
      var free = true;
      for (var p = c.startPeriod; p <= c.endPeriod; p++) {
        if (occ[c.day + '-' + p]) { free = false; break; }
      }
      if (!free) { conflicts.push(c); continue; }
      for (var p2 = c.startPeriod; p2 <= c.endPeriod; p2++) { occ[c.day + '-' + p2] = true; }
      placed.push(c);
    }
    return { placed: placed, conflicts: conflicts };
  }
  function coursesOfDay(week, day) {
    return state.courses.filter(function (c) { return c.day === day && inWeek(c, week); })
      .sort(function (a, b) { return a.startPeriod - b.startPeriod; });
  }

    var st = state.settings;

    if (week < 1 || week > st.totalWeeks) {

  function viewScheduleGrid() {
    var st = state.settings;

    var rw = realWeek();
    var tdow = todayDow();
    var h = '';

    h += '<div class="panel">';
    h += weekHeadHtml(week);
    h += '<div class="toolbar">';
    h += '<button class="btn" data-act="week-prev" title="上一周">◀</button>';
    h += '<button class="btn" data-act="week-today">本周</button>';
    h += '<button class="btn" data-act="week-next" title="下一周">▶</button>';

    }

    h += '<div class="grid-wrap"><div class="grid" style="grid-template-columns:var(--taxis) repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(' + n + ',minmax(var(--rowh),1fr));">';
    h += '<div class="g-corner" style="grid-column:1;grid-row:1;"></div>';

    for (var d = 1; d <= 7; d++) {
      var dt = dateOf(week, d);
      var isToday = (week === rw && d === tdow);
      var isWeekend = (d >= 6);
      h += '<div class="g-day' + (isToday ? ' is-today' : '') + (isWeekend ? ' is-weekend' : '') +
           '" style="grid-column:' + (d + 1) + ';grid-row:1;">' +
           '<span class="d-name">' + DAY_NAMES[d - 1] + '</span>' +
           '<span class="d-date">' + dt.getDate() + '</span></div>';
    }

    /* 当前时刻落在第几节（用来在今天那一列画一条“现在”线） */
    var nowPeriod = -1;
    if (week === rw) {
      var nowHM = pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes());
      for (var np = 1; np <= n; np++) {
        var pp = st.periods[np - 1];
        if (pp && pp[0] && nowHM >= pp[0] && nowHM <= pp[1]) { nowPeriod = np; break; }
      }
    }

    for (var pi = 1; pi <= n; pi++) {
      var tt = st.periods[pi - 1] || ['', ''];
      var grp = pi <= 4 ? 1 : (pi <= 8 ? 2 : 3);
      h += '<div class="g-time grp-' + grp + '" style="grid-column:1;grid-row:' + (pi + 1) + ';">' +
           '<span class="g-period">' + pi + '</span>' +
           '<b>' + esc(tt[0]) + '</b><span>' + esc(tt[1]) + '</span></div>';
      for (var dd = 1; dd <= 7; dd++) {
        var scls = 'g-slot grp-' + grp;
        if (week === rw && dd === tdow) {
          scls += ' is-todaycol';
          if (pi === nowPeriod) { scls += ' now'; }

        h += '<div class="' + scls + '" style="grid-column:' + (dd + 1) + ';grid-row:' + (pi + 1) + ';" ' +
             'data-act="add-course" data-day="' + dd + '" data-period="' + pi + '" ' +
             'title="' + DAY_NAMES[dd - 1] + ' 第 ' + pi + ' 节，点击添加"></div>';
      }

    for (var k = 0; k < placed.length; k++) {
      var cc = placed[k];

      if (cc.location) { sub.push('<div class="c-loc">📍 ' + esc(cc.location) + '</div>'); }
      if (cc.teacher) { sub.push('<div class="c-t">👤 ' + esc(cc.teacher) + '</div>'); }

      h += '<div class="course" style="grid-column:' + (cc.day + 1) + ';grid-row:' + (cc.startPeriod + 1) + ' / span ' + span + ';--c:' + esc(cc.color) + ';" ' +
           'data-act="edit-course" data-id="' + esc(cc.id) + '" title="' + esc(periodLabelOf(cc) + ' ' + timeRangeOf(cc) + ' ' + weekLabelOf(cc)) + '">' +
           '<div class="c-name">' + esc(cc.name) + '</div>' + sub.join('') + '</div>';
    }
    h += '</div></div>';
    h += '</div>';

    h += courseListHtml();
    return h;
  }

  /* =======================================================
     视图：时间规划
     ======================================================= */
  function sortedTasks() {
    var arr = state.tasks.slice();
    var f = state.ui.taskFilter;
    arr = arr.filter(function (t) {
      if (f === 'open') { return !t.done; }
      if (f === 'done') { return t.done; }
      return true;
    });
    var sort = state.ui.taskSort;
    arr.sort(function (a, b) {
      if (a.done !== b.done) { return a.done ? 1 : -1; }
      if (sort === 'priority') {
        var rank = { high: 0, normal: 1, low: 2 };
        var r = rank[a.priority] - rank[b.priority];
        if (r !== 0) { return r; }
      }
      if (sort === 'due') {
        if (a.due && b.due) {
          var c = a.due < b.due ? -1 : (a.due > b.due ? 1 : 0);
          if (c !== 0) { return c; }
        } else if (a.due && !b.due) { return -1; }
        else if (!a.due && b.due) { return 1; }
      }
      return a.createdAt - b.createdAt;
    });
    return arr;
  }

  function dueText(t) {
    if (!t.due) { return '无截止时间'; }
    var d = new Date(t.due);
    if (isNaN(d.getTime())) { return t.due; }
    var now = new Date();
    var diffH = (d - now) / 3600000;
    var stamp = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var extra = '';
    if (!t.done) {
      if (diffH < 0) { extra = ' · 已逾期'; }
      else if (diffH <= 24) { extra = ' · 不到 1 天'; }
      else { extra = ' · 还有 ' + Math.floor(diffH / 24) + ' 天'; }
    }
    return '截止 ' + stamp + extra;
  }

         '<option value="due"' + (state.ui.taskSort === 'due' ? ' selected' : '') + '>按截止时间</option>' +
         '<option value="priority"' + (state.ui.taskSort === 'priority' ? ' selected' : '') + '>按优先级</option>' +
         '<option value="created"' + (state.ui.taskSort === 'created' ? ' selected' : '') + '>按创建顺序</option>' +
         '</select></label>';
    h += '</div>';

    var arr = sortedTasks();
    if (state.ui.taskFilter === 'today') {
      var end = addDays(new Date(), 1);
      arr = arr.filter(function (t) { return !t.due || new Date(t.due) < end; });
    }
    if (arr.length === 0) {
      h += '<div class="empty">这里空空如也 —— 在上方输入框添加一个任务吧</div>';
    } else {
      h += '<div class="list">';
      for (var i = 0; i < arr.length; i++) {
        var t = arr[i];
        var overdue = !t.done && t.due && new Date(t.due) < new Date();
        var courseName = '';
        for (var ci = 0; ci < state.courses.length; ci++) {
          if (state.courses[ci].id === t.courseId) { courseName = state.courses[ci].name; break; }
        }
        h += '<div class="item' + (t.done ? ' done' : '') + (overdue ? ' overdue' : '') + '">';
        h += '<button class="check' + (t.done ? ' on' : '') + '" data-act="toggle-task" data-id="' + esc(t.id) + '" title="标记完成">✓</button>';
        h += '<div class="grow"><div class="t1">' + esc(t.title) + '</div><div class="t2">' + esc(dueText(t)) +
             (courseName ? ' · ' + esc(courseName) : '') + (t.note ? ' · ' + esc(t.note) : '') + '</div></div>';
        h += '<span class="tag ' + PRIORITY[t.priority].cls + '">' + PRIORITY[t.priority].label + '</span>';
        h += '<button class="btn tiny" data-act="edit-task" data-id="' + esc(t.id) + '">编辑</button>';
        h += '<button class="btn tiny danger" data-act="del-task" data-id="' + esc(t.id) + '">删除</button>';
        h += '</div>';
      }
      h += '</div>';
    }
    h += '</div>';

    /* 右：侧栏 */
    h += '<div class="side">';

    h += '<div class="panel">';
    h += '<p class="section-title"><span class="dot"></span>专注计时器</p>';
    h += '<div class="timer focus" id="timerBox">';
    h += '<div class="t-time" id="timerTime">25:00</div>';
    h += '<div class="t-label" id="timerLabel">专注中 · 今日已完成 0 个番茄</div>';
    h += '<div class="t-btns">';
    h += '<button class="btn primary" data-act="timer-toggle" id="timerToggle">开始</button>';
    h += '<button class="btn" data-act="timer-reset">重置</button>';
    h += '<button class="btn" data-act="timer-switch">切换专注/休息</button>';
    h += '</div></div>';
    h += '<p class="hint" style="margin:10px 0 0">默认 25 分钟专注 / 5 分钟休息，可在「设置」里调整。结束时会响铃提醒。</p>';
    h += '</div>';

    h += '<div class="panel">';
    h += '<p class="section-title"><span class="dot"></span>今日课程 · ' + DAY_NAMES[tdow - 1] + '</p>';
    if (todayList.length === 0) {
      h += '<div class="empty">今天没有课，可以安排自习或休息</div>';
    } else {
      h += '<div class="list">';
      for (var ti = 0; ti < todayList.length; ti++) {
        var tc = todayList[ti];
        h += '<div class="item">';
        h += '<span class="swatch" style="background:' + esc(tc.color) + '"></span>';
        h += '<div class="grow"><div class="t1">' + esc(tc.name) + '</div><div class="t2">' +
             '第 ' + tc.startPeriod + '-' + tc.endPeriod + ' 节 · ' + esc(timeRangeOf(tc)) +
             (tc.location ? ' · ' + esc(tc.location) : '') + '</div></div>';
        h += '</div>';
      }
      h += '</div>';
    }
    h += '</div>';

    /* 今日到期 */
    h += '<div class="panel">';
    h += '<p class="section-title"><span class="dot"></span>最近 3 天到期</p>';
    var soon = state.tasks.filter(function (t) {
      return !t.done && t.due && new Date(t.due) < addDays(new Date(), 3);
    }).sort(function (a, b) { return a.due < b.due ? -1 : 1; });
    if (soon.length === 0) {
      h += '<div class="empty">没有临近的截止任务 🎉</div>';
    } else {
      h += '<div class="list">';
      for (var si = 0; si < soon.length; si++) {
        var s = soon[si];
        var od = new Date(s.due) < new Date();
        h += '<div class="item' + (od ? ' overdue' : '') + '">';
        h += '<div class="grow"><div class="t1">' + esc(s.title) + '</div><div class="t2">' + esc(dueText(s)) + '</div></div>';
        h += '<span class="tag ' + PRIORITY[s.priority].cls + '">' + PRIORITY[s.priority].label + '</span>';
        h += '</div>';
      }
      h += '</div>';
    }
    h += '</div>';

    h += '</div>'; /* side */
    h += '</div>'; /* plan-layout */
    return h;
  }

  /* =======================================================
     视图：统计
     ======================================================= */
  function viewStats() {
    var st = state.settings;
    var week = state.ui.week;
    var rw = realWeek();
    var h = '';

    var active = state.courses.filter(function (c) { return inWeek(c, week); });
    var weekPeriods = active.reduce(function (s, c) { return s + periodsOf(c); }, 0);
    var openTasks = state.tasks.filter(function (t) { return !t.done; }).length;
    var doneTasks = state.tasks.length - openTasks;
    var rate = state.tasks.length ? Math.round(doneTasks / state.tasks.length * 100) : 0;
    var todayPeriods = state.courses.filter(function (c) { return c.day === todayDow() && inWeek(c, rw); })
      .reduce(function (s, c) { return s + periodsOf(c); }, 0);

    h += '<div class="panel">';
    h += '<p class="section-title"><span class="dot"></span>概览</p>';
    h += '<div class="stat-cards">';
    h += '<div class="stat"><div class="v">' + state.courses.length + '</div><div class="k">课程总数</div></div>';
    h += '<div class="stat"><div class="v">' + weekPeriods + '</div><div class="k">第 ' + week + ' 周课时（节）</div></div>';
    h += '<div class="stat"><div class="v">' + todayPeriods + '</div><div class="k">今日课时（节）</div></div>';
    h += '<div class="stat"><div class="v">' + openTasks + '</div><div class="k">未完成任务</div></div>';
    h += '<div class="stat"><div class="v">' + rate + '%</div><div class="k">任务完成率</div></div>';
    var pc = (state.pomo.date === toYMD(new Date())) ? state.pomo.count : 0;
    h += '<div class="stat"><div class="v">' + pc + '</div><div class="k">今日番茄数</div></div>';
    h += '</div>';
    h += '<p class="hint" style="margin-top:12px">课时统计基于顶部查看的第 ' + week + ' 周（可在「课表」中切换周次）。</p>';
    h += '</div>';

    /* 每日课时 */
    h += '<div class="panel">';
    h += '<p class="section-title"><span class="dot"></span>第 ' + week + ' 周每日课时分布</p>';
    var perDay = [0, 0, 0, 0, 0, 0, 0];
    for (var i = 0; i < active.length; i++) { perDay[active[i].day - 1] += periodsOf(active[i]); }
    var maxDay = Math.max.apply(null, perDay.concat([1]));
    h += '<div class="bars">';
    for (var d = 0; d < 7; d++) {
      var pct = Math.round(perDay[d] / maxDay * 100);
      var isTodayCol = (week === rw && (d + 1) === todayDow());
      h += '<div class="bar-col">';
      h += '<span class="bar-v">' + (perDay[d] || '') + '</span>';
      h += '<div class="bar' + (isTodayCol ? ' today' : '') + '" style="height:' + Math.max(pct, 2) + '%"></div>';
      h += '<span class="bar-lb">' + DAY_NAMES[d] + '</span>';
      h += '</div>';
    }
    h += '</div>';
    h += '</div>';

    /* 每门课总课时 */
    h += '<div class="panel">';
    h += '<p class="section-title"><span class="dot"></span>各课程学期总课时（周节数 × 上课周数）</p>';
    if (state.courses.length === 0) {
      h += '<div class="empty">暂无课程数据</div>';
    } else {
      var rows = state.courses.map(function (c) {
        return { c: c, total: periodsOf(c) * weekCountOf(c) };
      }).sort(function (a, b) { return b.total - a.total; });
      var maxTotal = Math.max.apply(null, rows.map(function (r) { return r.total; }).concat([1]));
      for (var r2 = 0; r2 < rows.length; r2++) {
        var row = rows[r2];
        var w2 = Math.round(row.total / maxTotal * 100);
        var link = state.tasks.filter(function (t) { return t.courseId === row.c.id; });
        var linkDone = link.filter(function (t) { return t.done; }).length;
        h += '<div class="hbar-row">';
        h += '<span class="nm" title="' + esc(row.c.name) + '">' + esc(row.c.name) + '</span>';
        h += '<span class="hbar-track"><span class="hbar" style="width:' + Math.max(w2, 2) + '%;background:' + esc(row.c.color) + '"></span></span>';
        h += '<span class="vv">' + row.total + ' 节' + (link.length ? ' / ' + linkDone + '-' + link.length : '') + '</span>';
        h += '</div>';
      }
      h += '<p class="hint" style="margin-top:10px">右侧数字为学期总节数（斜杠后为该课程关联任务的完成数 / 总数）。</p>';
    }
    h += '</div>';

    /* 任务概览 */
    h += '<div class="panel">';
    h += '<p class="section-title"><span class="dot"></span>任务完成情况</p>';
    if (state.tasks.length === 0) {
      h += '<div class="empty">还没有任务记录</div>';
    } else {
      var total = state.tasks.length;
      var pctDone = Math.round(doneTasks / total * 100);
      h += '<div class="hbar-row"><span class="nm">全部任务</span>';
      h += '<span class="hbar-track"><span class="hbar" style="width:' + pctDone + '%;background:var(--ok)"></span></span>';
      h += '<span class="vv">' + doneTasks + ' / ' + total + '</span></div>';
      var byP = ['high', 'normal', 'low'];
      for (var bp = 0; bp < byP.length; bp++) {
        var key = byP[bp];
        var tot = state.tasks.filter(function (t) { return t.priority === key; }).length;
        var dn = state.tasks.filter(function (t) { return t.priority === key && t.done; }).length;
        var pc2 = tot ? Math.round(dn / tot * 100) : 0;
        h += '<div class="hbar-row"><span class="nm">' + PRIORITY[key].label + '优先级</span>';
        h += '<span class="hbar-track"><span class="hbar" style="width:' + pc2 + '%;background:var(--accent)"></span></span>';
        h += '<span class="vv">' + dn + ' / ' + tot + '</span></div>';
      }
    }
    h += '</div>';
    return h;
  }

  /* =======================================================
     渲染入口
     ======================================================= */
  var lastRenderedTab = null;

  function render() {
    applyFontScale();
    var main = qs('#main');
    var tabChanged = (lastRenderedTab !== state.ui.tab);
    if (state.ui.tab === 'schedule') { main.innerHTML = viewSchedule(); }
    else if (state.ui.tab === 'tasks') { main.innerHTML = viewTasks(); }
    else if (state.ui.tab === 'stats') { main.innerHTML = viewStats(); }
    else { main.innerHTML = viewSettings(); }
    /* 只在切换页面时播放入场动画；同一个页面内的局部刷新不重复播，否则会很晃 */
    if (tabChanged && !reducedMotion()) {
      try {
        main.classList.remove('view-in');
        void main.offsetWidth;   /* 强制重排，让动画能重新开始 */
        main.classList.add('view-in');
      } catch (e) { /* 忽略 */ }
    }
    lastRenderedTab = state.ui.tab;
    paintChrome();
    paintTimer();
  }

         '<option value="odd"' + (c.parity === 'odd' ? ' selected' : '') + '>仅单周</option>' +

  /* =======================================================
     冲突检测
     ======================================================= */
  function findConflicts(c) {
    var out = [];
    for (var i = 0; i < state.courses.length; i++) {
      var o = state.courses[i];
      if (o.id === c.id) { continue; }
      if (overlaps(o, c)) { out.push(o); }
    }
    return out;
  }

  /* =======================================================
     表单处理
     ======================================================= */
  function submitCourse(form) {
    var fd = new FormData(form);
    var id = String(fd.get('id') || '');
    var name = String(fd.get('name') || '').trim();
    if (!name) { toast('请填写课程名称'); return; }
    var st = state.settings;
    var start = clampInt(fd.get('startPeriod'), 1, st.periodsPerDay, 1);
    var end = clampInt(fd.get('endPeriod'), 1, st.periodsPerDay, start);
    if (end < start) { var tmp = start; start = end; end = tmp; }
    var ws = clampInt(fd.get('weekStart'), 1, 30, 1);
    var we = clampInt(fd.get('weekEnd'), 1, 30, ws);
    if (we < ws) { var t2 = ws; ws = we; we = t2; }
    var obj = {
      id: id || uid('c_'),
      name: name,
      teacher: String(fd.get('teacher') || '').trim(),
      location: String(fd.get('location') || '').trim(),
      note: String(fd.get('note') || '').trim(),
      color: String(fd.get('color') || COLORS[0]),
      day: clampInt(fd.get('day'), 1, 7, 1),
      startPeriod: start,
      endPeriod: end,
      weekStart: ws,
      weekEnd: we,
      parity: String(fd.get('parity') || 'all')
    };
    if (obj.parity !== 'odd' && obj.parity !== 'even') { obj.parity = 'all'; }
    obj.id = obj.id || uid('c_');

    var found = -1;
    for (var i = 0; i < state.courses.length; i++) { if (state.courses[i].id === obj.id) { found = i; break; } }
    var conflicts = findConflicts(obj);
    if (conflicts.length) {
      var names = conflicts.map(function (x) { return x.name; }).join('、');
      if (!confirm('注意：该时间与「' + names + '」重叠，仍要保存吗？')) { return; }
    }
    if (found >= 0) { state.courses[found] = obj; } else { state.courses.push(obj); }
    save(); closeModal(); render();
    toast(found >= 0 ? '课程已更新' : '课程已添加');
  }

  function submitTask(form) {
    var fd = new FormData(form);
    var id = String(fd.get('id') || '');
    var title = String(fd.get('title') || '').trim();
    if (!title) { toast('请填写任务内容'); return; }
    var obj = {
      id: id || uid('t_'),
      title: title,
      due: String(fd.get('due') || ''),
      priority: String(fd.get('priority') || 'normal'),
      courseId: String(fd.get('courseId') || ''),
      note: String(fd.get('note') || '').trim(),
      done: false,
      createdAt: Date.now()
    };
    var found = -1;
    for (var i = 0; i < state.tasks.length; i++) { if (state.tasks[i].id === obj.id) { found = i; break; } }
    if (found >= 0) { obj.done = state.tasks[found].done; obj.createdAt = state.tasks[found].createdAt; state.tasks[found] = obj; }
    else { state.tasks.push(obj); }
    save(); closeModal(); render();
    toast(found >= 0 ? '任务已更新' : '任务已添加');
  }

  function collectTimes(form, n) {
    var fd = new FormData(form);
    var out = [];
    for (var i = 0; i < n; i++) {
      var s = String(fd.get('p' + i + 's') || '').trim();
      var e = String(fd.get('p' + i + 'e') || '').trim();
      out.push([s, e]);
    }
    return out;
  }

  function submitSettings(form) {
    var fd = new FormData(form);
    var prev = state.settings.periods;
    var n = clampInt(fd.get('periodsPerDay'), 4, 16, state.settings.periodsPerDay);
    // 表单里的时间行数可能少于/多于 n，先按表单实际行数读取
    var formRows = 0;
    while (form.querySelector('input[name="p' + formRows + 's"]')) { formRows++; }
    var read = collectTimes(form, formRows);

    state.settings.semesterStart = String(fd.get('semesterStart') || state.settings.semesterStart);
    state.settings.totalWeeks = clampInt(fd.get('totalWeeks'), 1, 30, 20);
    state.settings.periodsPerDay = n;
    var times = [];
    for (var i = 0; i < n; i++) {
      var a = (read[i] && read[i][0]) || (prev[i] && prev[i][0]) || DEFAULT_TIMES[i % DEFAULT_TIMES.length][0];
      var b = (read[i] && read[i][1]) || (prev[i] && prev[i][1]) || DEFAULT_TIMES[i % DEFAULT_TIMES.length][1];
      times.push([a, b]);
    }
    state.settings.periods = times;
    state.settings.focusMin = clampInt(fd.get('focusMin'), 1, 180, 25);
    state.settings.breakMin = clampInt(fd.get('breakMin'), 1, 60, 5);
    var th = String(fd.get('theme') || 'auto');
    state.settings.theme = (th === 'light' || th === 'dark') ? th : 'auto';
    var fs = String(fd.get('fontScale') || 'm');
    state.settings.fontScale = ['s', 'm', 'l', 'xl'].indexOf(fs) >= 0 ? fs : 'm';
    state.settings.haptics = !!fd.get('haptics');

    // 节次被裁掉时把课程时间收进范围内
    for (var ci = 0; ci < state.courses.length; ci++) {
      var c = state.courses[ci];
      if (c.startPeriod > n) { c.startPeriod = n; }
      if (c.endPeriod > n) { c.endPeriod = n; }
      if (c.endPeriod < c.startPeriod) { c.endPeriod = c.startPeriod; }
    }
    applyTheme();
    save(); render();
    toast('设置已保存');
  }

  /* =======================================================
     计时器
     ======================================================= */
  function timerSetMode(mode, resetLeft) {
    timer.mode = mode;
    timer.total = (mode === 'focus' ? state.settings.focusMin : state.settings.breakMin) * 60;
    if (resetLeft) { timer.left = timer.total; }
  }
  function timerPaint() {
    var box = qs('#timerBox');
    if (box) {
      box.className = 'timer ' + (timer.mode === 'focus' ? 'focus' : 'brk');
    }
    var el = qs('#timerTime');
    var mm = Math.floor(Math.max(timer.left, 0) / 60);
    var ss = Math.max(timer.left, 0) % 60;
    var txt = pad2(mm) + ':' + pad2(ss);
    if (el) { el.textContent = txt; }
    var lb = qs('#timerLabel');
    if (lb) {
      var pc = (state.pomo.date === toYMD(new Date())) ? state.pomo.count : 0;
      lb.textContent = (timer.mode === 'focus' ? '专注中' : '休息中') + ' · 今日已完成 ' + pc + ' 个番茄';
    }
    var btn = qs('#timerToggle');
    if (btn) { btn.textContent = timer.running ? '暂停' : '开始'; }
    if (timer.running) { document.title = txt + ' · ' + (timer.mode === 'focus' ? '专注中' : '休息中'); }
    else { document.title = '课表规划工具'; }
  }
  function paintTimer() { timerPaint(); }

  function timerStart() {
    if (timer.running) { return; }
    if (timer.left <= 0) { timerSetMode(timer.mode, true); }
    timer.running = true;
    timer.handle = setInterval(function () {
      timer.left--;
      if (timer.left <= 0) {
        timer.running = false;
        clearInterval(timer.handle);
        timer.handle = null;
        beep();
        if (timer.mode === 'focus') {
          var today = toYMD(new Date());
          if (state.pomo.date !== today) { state.pomo = { date: today, count: 0 }; }
          state.pomo.count++;
          save();
          timerSetMode('break', true);
          toast('专注结束，休息 ' + state.settings.breakMin + ' 分钟吧 ☕');
        } else {
          timerSetMode('focus', true);
          toast('休息结束，继续加油 💪');
        }
        render();
      }
      timerPaint();
    }, 1000);
    timerPaint();
  }
  function timerPause() {
    timer.running = false;
    if (timer.handle) { clearInterval(timer.handle); timer.handle = null; }
    timerPaint();
  }
  function timerReset() {
    timerPause();
    timerSetMode(timer.mode, true);
    timerPaint();
  }
  function timerSwitch() {
    timerPause();
    timerSetMode(timer.mode === 'focus' ? 'break' : 'focus', true);
    timerPaint();
  }

  /* 用“复制一段文字”的方式在手机和电脑之间搬运数据：不依赖文件传输，微信发给自己就行 */
  function showBackupText() {

    h += '<h3>复制备份文字</h3>';
    h += '<p class="sub">下面这段文字就是你的全部课表和任务。全选复制，发给自己（微信/QQ 都行），在另一台设备上点「📋 粘贴恢复」即可。</p>';

  function copyBackupText() {
    var ta = qs('#backupText');
    if (!ta) { return; }
    ta.focus();
    ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    if (done) { toast('已复制到剪贴板'); return; }
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () { toast('已复制到剪贴板'); },
        function () { toast('请长按选中后手动复制'); });
      return;
    }
    toast('请长按选中后手动复制');

  function showRestoreText() {
    var h = '';
    h += '<h3>粘贴恢复数据</h3>';
    h += '<p class="sub">把之前「复制备份文字」得到的内容粘贴到这里，就能恢复课表和任务。注意会覆盖当前数据。</p>';
    h += '<textarea class="imp-area" id="restoreText" style="min-height:130px;white-space:pre-wrap;word-break:break-all" placeholder="在此粘贴备份文字…"></textarea>';
    h += '<div class="modal-foot">';

    setTimeout(function () { var ta = qs('#restoreText'); if (ta) { ta.focus(); } }, 40);

  function restoreBackupText() {
    var ta = qs('#restoreText');
    var txt = ta ? ta.value.replace(/^\s+|\s+$/g, '') : '';
    if (!txt) { toast('请先粘贴备份文字'); return; }
    var obj;
    try { obj = JSON.parse(txt); }
    catch (e) { toast('内容无法解析，请确认复制完整'); return; }
    if (!obj || typeof obj !== 'object') { toast('内容格式不对'); return; }
    if (!confirm('将覆盖当前所有课表与任务数据，确定继续吗？')) { return; }
    state = normalize(obj);
    var today = toYMD(new Date());
    state.ui.week = Math.min(Math.max(realWeek(), 1), state.settings.totalWeeks);
    state.ui.day = todayDow();
    state.ui.lastOpen = today;
    applyTheme(); save(); closeModal(); render();
    toast('恢复成功');
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(String(reader.result));
        if (!obj || typeof obj !== 'object') { throw new Error('格式不正确'); }
        if (!confirm('导入将覆盖当前所有课表与任务数据，确定继续吗？')) { return; }
        state = normalize(obj);
        var today = toYMD(new Date());
        state.ui.week = Math.min(Math.max(realWeek(), 1), state.settings.totalWeeks);
        state.ui.lastOpen = today;
        applyTheme();
        save(); render();
        toast('导入成功');
      } catch (e) {
        toast('导入失败：' + (e && e.message ? e.message : '文件无法解析'));
      }
    };
    reader.readAsText(file);
  }

  /* =======================================================
     事件：点击
     ======================================================= */
  document.addEventListener('click', function (e) {
    var mask = e.target.closest ? e.target.closest('.modal-mask') : null;
    if (mask && e.target === mask) { closeModal(); return; }

    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) { return; }
    var act = el.getAttribute('data-act');

    switch (act) {
      case 'tab':
        state.ui.tab = el.getAttribute('data-v');
        save(); render();
        break;
      case 'theme':
        toggleTheme();
        break;
      case 'week-prev':
        state.ui.week = Math.max(1, state.ui.week - 1); save(); render();
        break;
      case 'week-next':
        state.ui.week = state.ui.week + 1; save(); render();
        break;
      case 'week-today':
        state.ui.week = Math.min(Math.max(realWeek(), 1), state.settings.totalWeeks); save(); render();
        break;
      case 'pick-day':
        state.ui.day = clampInt(el.getAttribute('data-v'), 1, 7, 1);
        save(); render();
        break;
      case 'view-grid':
        state.ui.view = 'grid'; save(); render();
        break;
      case 'view-day':
        state.ui.view = 'day'; save(); render();
        break;
      case 'add-course':
        courseModal('', parseInt(el.getAttribute('data-day'), 10) || 1, parseInt(el.getAttribute('data-period'), 10) || 1);
        break;
      case 'edit-course':
        courseModal(el.getAttribute('data-id'), 1, 1);
        break;
      case 'del-course': {
        var cid = el.getAttribute('data-id');
        var nm = '';
        for (var i = 0; i < state.courses.length; i++) { if (state.courses[i].id === cid) { nm = state.courses[i].name; break; } }
        if (!confirm('确定删除课程「' + nm + '」吗？')) { break; }
        state.courses = state.courses.filter(function (x) { return x.id !== cid; });
        save(); closeModal(); render();
        toast('已删除课程');
        break;
      }
      case 'edit-task':
        taskModal(el.getAttribute('data-id'));
        break;
      case 'del-task': {
        var tid = el.getAttribute('data-id');
        var tname = '';
        for (var j = 0; j < state.tasks.length; j++) { if (state.tasks[j].id === tid) { tname = state.tasks[j].title; break; } }
        if (!confirm('确定删除任务「' + tname + '」吗？')) { break; }
        state.tasks = state.tasks.filter(function (x) { return x.id !== tid; });
        save(); closeModal(); render();
        toast('已删除任务');
        break;
      }
      case 'toggle-task': {

        closeModal();
        break;
      case 'load-demo':
        loadDemo();
        break;
      case 'clear-all':
        if (!confirm('将删除全部课程、任务与设置，且无法恢复。建议先导出备份。确定继续吗？')) { break; }

      case 'export':
        exportData();
        break;
      case 'backup-show':
        showBackupText();
        break;
      case 'backup-copy':
        copyBackupText();
        break;
      case 'backup-paste':
        showRestoreText();
        break;
      case 'backup-restore':
        restoreBackupText();
        break;

        if (installPrompt) {

      case 'install-help':
        showInstallHelp();
        break;
      case 'diag-install':
        runInstallDiagnosis();
        break;
      case 'import': {
        var fi = qs('#importFile');
        if (fi) { fi.click(); }
        break;
      }
      case 'open-import':
        openImportModal();
        break;
      case 'imp-file': {
        var fi2 = qs('#impFileInput');
        if (fi2) { fi2.click(); }
        break;
      }
      case 'imp-sample': {
        var ta = qs('#impText');
